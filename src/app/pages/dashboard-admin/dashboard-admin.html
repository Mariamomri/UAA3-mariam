<div class="dashboard-page">
  <div class="page-banner">
    <h1>Dashboard Admin</h1>
    <p>Gérez les patients, les médecins et les rendez-vous de la clinique.</p>
  </div>

  <nav class="onglets">
    <button
      class="onglet"
      [class.actif]="onglet() === 'patients'"
      (click)="changerOnglet('patients')"
    >
      Patients
    </button>
    <button
      class="onglet"
      [class.actif]="onglet() === 'medecins'"
      (click)="changerOnglet('medecins')"
    >
      Médecins
    </button>
    <button
      class="onglet"
      [class.actif]="onglet() === 'rendezvous'"
      (click)="changerOnglet('rendezvous')"
    >
      Rendez-vous
    </button>
  </nav>

  @if (onglet() === 'patients') {
    <app-gestion-patients></app-gestion-patients>
  }
  @if (onglet() === 'medecins') {
    <app-gestion-medecins></app-gestion-medecins>
  }
  @if (onglet() === 'rendezvous') {
    <app-liste-rendezvous></app-liste-rendezvous>
  }
</div>
