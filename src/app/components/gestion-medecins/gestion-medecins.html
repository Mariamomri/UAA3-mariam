<div class="gestion">
  <h2>Gestion des Médecins</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="nom">Nom :</label>
      <input id="nom" type="text" formControlName="nom" />
    </div>
    <div>
      <label for="email">Email :</label>
      <input id="email" type="email" formControlName="email" />
    </div>
    <div>
      <label for="password">Mot de passe :</label>
      <input id="password" type="text" formControlName="password" />
    </div>
    <div>
      <label for="telephone">Téléphone :</label>
      <input id="telephone" type="text" formControlName="telephone" />
    </div>
    <div>
      <label for="specialite">Spécialité :</label>
      <input id="specialite" type="text" formControlName="specialite" />
    </div>
    <button type="submit">{{ idEnModification ? 'Modifier' : 'Ajouter' }}</button>
    @if (idEnModification) {
      <button type="button" (click)="annuler()">Annuler</button>
    }
  </form>

  <table>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Téléphone</th>
      <th>Spécialité</th>
      <th>Actions</th>
    </tr>
    @for (medecin of medecins(); track medecin.id) {
      <tr>
        <td>{{ medecin.nom }}</td>
        <td>{{ medecin.email }}</td>
        <td>{{ medecin.telephone | telephone }}</td>
        <td>{{ medecin.specialite }}</td>
        <td>
          <button (click)="modifier(medecin)">Modifier</button>
          <button (click)="supprimer(medecin.id!)">Supprimer</button>
        </td>
      </tr>
    }
  </table>
</div>
